[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-filter-toolkit"
version = "0.1.0"
description = "Typed FIR and IIR audio filtering for NumPy and PyTorch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "soundfile>=0.12",
    "torch>=2.0",
    "torchaudio>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
